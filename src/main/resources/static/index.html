<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poker Night</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">♠</div>
          <div>
            <div class="brand-title">Poker Night</div>
            <div class="brand-subtitle">Texas Hold'em • Live table</div>
          </div>
        </div>
        <div class="top-actions">
          <button id="startHandBtn" class="ghost-button">Start hand</button>
          <button id="advanceStreetBtn" class="ghost-button">Next street</button>
        </div>
      </header>

      <main class="game-layout">
        <section class="table-panel">
          <div class="table-wrap">
            <div class="table-surface">
              <div class="table-lights"></div>
              <div class="table-grid">
                <div id="seat-0" class="seat seat-0"></div>
                <div id="seat-1" class="seat seat-1"></div>
                <div id="seat-2" class="seat seat-2"></div>
                <div id="seat-3" class="seat seat-3"></div>
                <div id="seat-4" class="seat seat-4"></div>
                <div id="seat-5" class="seat seat-5"></div>
                <div id="seat-6" class="seat seat-6"></div>
                <div id="seat-7" class="seat seat-7"></div>

                <div class="community-box">
                  <div class="board-header">
                    <span id="streetLabel">Preflop</span>
                    <span id="potValue">Pot: $0</span>
                  </div>
                  <div id="boardCards" class="board-cards"></div>
                </div>
              </div>
            </div>
          </div>

          <div class="player-cards-panel">
            <div class="panel-title">Your cards</div>
            <div id="privateCards" class="private-cards"></div>
          </div>
        </section>

        <aside class="side-panel">
          <div class="panel-box login-box">
            <div class="panel-title">Join table</div>
            <form id="joinForm">
              <input id="nicknameInput" type="text" maxlength="20" placeholder="Enter nickname" />
              <button type="submit">Sit down</button>
            </form>
          </div>

          <div class="panel-box actions-box">
            <div class="panel-title">Actions</div>
            <div class="action-grid">
              <button data-action="CHECK">Check</button>
              <button data-action="CALL">Call</button>
              <button data-action="BET">Bet</button>
              <button data-action="RAISE">Raise</button>
              <button data-action="FOLD">Fold</button>
              <button data-action="ALL_IN">All-in</button>
            </div>
            <div class="amount-row">
              <label for="amountInput">Amount</label>
              <input id="amountInput" type="number" min="0" step="10" value="20" />
            </div>
          </div>

          <div class="panel-box chat-box">
            <div class="panel-title">Table chat</div>
            <div id="chatMessages" class="chat-messages"></div>
            <form id="chatForm" class="chat-form">
              <input id="chatInput" type="text" maxlength="140" placeholder="Say something..." />
              <button type="submit">Send</button>
            </form>
          </div>
        </aside>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
